# v2 A/B/C (fixed before running). Changes vs ab_config.yaml (v1), motivated by the v1 pilot (results/RESULTS.md):
#  - tasks where the planted problem is NOT fixable at the objective level (planner cannot fix it itself)
#  - compute-matched: every arm runs until the shared budget is exhausted (analyzer early stop disabled for all arms)
#  - arm C: random-target control judge + the same validation gate
#  - single-op proposals (attribution) and a higher acceptance margin (v1 validation noise: median 0.005, mean 0.017)

models_file: llm_configs/models.yaml
credentials_file: llm_configs/credentials.yaml
models:
  planner: openai/gpt-5-mini-2025-08-07
  analyzer: openai/gpt-5-mini-2025-08-07
  scorer_matching: openai/gpt-5-mini-2025-08-07
  refusal_detection: openai/gpt-4.1-nano-2025-04-14
  judge: openai/gpt-5-mini-2025-08-07

results_subdir: v2
tasks: [stagnant_search, overflow_scorer, noisy_search]
seeds: [0, 1, 2]
arms: [A, B, C]
timeout_s: 5400

loop:
  max_iterations: 30                 # not binding: the budget below ends every run
  random_candidate_ratio: 0.0
  max_objective_planning_retries: 3
  stop_on_analyzer_decision: false   # same for all arms (compute matching)

budget:                              # identical for A, B, C
  max_llm_calls: 50
  max_total_tokens: 500000
  max_oracle_evals: 5000
  max_wall_time_s: 3000

optimizer:
  pop_size: 32
  generations: 10

planner:
  requires_objective_weights: true
  support_filter: true
  support_population_wise: false
  max_objectives: 3
  do_high_level_planning: false
  use_context_information: all_iterations
  max_llm_retries: 3

meta_controller:                     # arms B and C
  max_parse_retries: 1
  max_ops_per_change: 1
  validation:
    n_seeds: 2
    min_improvement: 0.02
    trial_optimizer_overrides: {}
  estimates: {judge_tokens: 8000, planner_call_tokens: 8000}
