# v2b (pre-registered in PREREG_v2b.md). Identical to ab_v2_config.yaml except for the grid:
# arm D on the three v2 tasks (A/B/C reused from the v2 run, code paths unchanged), and A/B/C/D on the
# held-out task underflow_cost. Results go to the same results/v2 directory so all arms are summarized together.

models_file: llm_configs/models.yaml
credentials_file: llm_configs/credentials.yaml
models:
  planner: openai/gpt-5-mini-2025-08-07
  analyzer: openai/gpt-5-mini-2025-08-07
  scorer_matching: openai/gpt-5-mini-2025-08-07
  refusal_detection: openai/gpt-4.1-nano-2025-04-14
  judge: openai/gpt-5-mini-2025-08-07

results_subdir: v2
grid:
  - {tasks: [stagnant_search, overflow_scorer, noisy_search], seeds: [0, 1, 2], arms: [D]}
  - {tasks: [underflow_cost], seeds: [0, 1, 2], arms: [A, B, C, D]}
tasks: [stagnant_search, overflow_scorer, noisy_search, underflow_cost]
seeds: [0, 1, 2]
timeout_s: 5400

loop:
  max_iterations: 30
  random_candidate_ratio: 0.0
  max_objective_planning_retries: 3
  stop_on_analyzer_decision: false

budget:
  max_llm_calls: 50
  max_total_tokens: 500000
  max_oracle_evals: 5000
  max_wall_time_s: 3000

optimizer:
  pop_size: 32
  generations: 10

planner:
  requires_objective_weights: true
  support_filter: true
  support_population_wise: false
  max_objectives: 3
  do_high_level_planning: false
  use_context_information: all_iterations
  max_llm_retries: 3

meta_controller:
  max_parse_retries: 1
  max_ops_per_change: 1
  validation:
    n_seeds: 2
    min_improvement: 0.02
    trial_optimizer_overrides: {}
  estimates: {judge_tokens: 8000, planner_call_tokens: 8000}
